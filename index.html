<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salud mental universitaria · UCV</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #fee2e2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .overlay[hidden] { display: none; }

    .modal {
      background: #ffffff;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 2rem 2rem 1.75rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .modal h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: #1e3a8a;
    }

    .modal p {
      margin: 0 0 1.5rem;
      line-height: 1.6;
      color: #334155;
    }

    .btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover { background: #b91c1c; }
    .btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  </style>
</head>
<body>

  <div class="overlay" id="bienvenida" role="dialog" aria-modal="true" aria-labelledby="titulo-bienvenida">
    <div class="modal">
      <h1 id="titulo-bienvenida">Universidad César Vallejo</h1>
      <p>
        💙 ¡Bienvenido/a a EmoSense! 💗<br>
        Un espacio seguro para expresar tus emociones, comprender lo que sientes y cuidar tu bienestar emocional. 🌷
      </p>
      <button type="button" class="btn" id="btn-comenzar">Comenzar</button>
    </div>
  </div>

  <script>
    const overlay = document.getElementById("bienvenida");
    const boton = document.getElementById("btn-comenzar");

    boton.addEventListener("click", () => {
      overlay.hidden = true;
    });

    boton.focus();
  </script>

</body>
</html>
